; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
build_dir = ./builds

[common]
build_flags = 
	-DVTABLES_IN_FLASH -D BEARSSL_SSL_BASIC
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D HTTPCLIENT_1_1_COMPATIBLE=0
	-DNDEBUG -DFP_IN_IROM -frandom-seed=b61f78373
build_flags_esp32 = 
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-DVTABLES_IN_FLASH -DBEARSSL_SSL_BASIC
build_flags_esp32_release = ${common.build_flags_esp32} -DNDEBUG
build_flags_esp32_debug = ${common.build_flags_esp32} -g -Og -fno-inline -DUSING_JTAG_DEBUGGER_PINS=1 -DDEBUG_ESP_PORT=Serial
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = spiffs
board_build.f_cpu = 160000000L
lib_deps_external_inside = 
	bblanchon/ArduinoJson@6.18.3
	mikalhart/TinyGPSPlus@1.0.2
	https://github.com/LoSk-p/esp-robonomics-client.git
	https://github.com/ricmoo/QRCode
	adafruit/Adafruit NeoPixel
lib_deps_external_urban = 
	bblanchon/ArduinoJson@6.18.3
	mikalhart/TinyGPSPlus@1.0.2
	https://github.com/LoSk-p/esp-robonomics-client.git
	adafruit/Adafruit NeoPixel
lib_deps_esp8266_platform = 
	Hash
	Wire
	ESP8266WiFi
	DNSServer
	ESP8266HTTPClient
	ESP8266WebServer
	ESP8266mDNS
	EspSoftwareSerial
lib_deps_esp32_platform = 
	WiFi
	DNSServer
	WiFiClientSecure
	HTTPClient
	FS
	SPIFFS
	WebServer
	Update
	ESPmDNS
lib_deps_urban = ${common.lib_deps_esp32_platform} ${common.lib_deps_external_urban}
lib_deps_inside = ${common.lib_deps_esp32_platform} ${common.lib_deps_external_inside}
extra_scripts = platformio_script.py
platform_version = espressif8266@2.6.2
platform_version_esp32 = platformio/espressif32

[env:esp32c3_en]
lang = EN
platform = platformio/espressif32
framework = arduino
board = esp32-c3-devkitm-1
build_flags = 
	${common.build_flags_esp32_release}
	'-DINTL_EN'
	'-DKIT_C'
	'-DARDUINO_USB_MODE=1'
	"-DARDUINO_USB_CDC_ON_BOOT=1"
	"-DALTRUIST_URBAN"
lib_deps = 
	${common.lib_deps_urban}
	plerup/EspSoftwareSerial@^8.2.0
extra_scripts = ${common.extra_scripts}
board_build.partitions = esp32c3_partitions.csv

[env:esp32c3_ru]
lang = RU
platform = platformio/espressif32
framework = arduino
board = esp32-c3-devkitm-1
